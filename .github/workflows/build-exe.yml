name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build app exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name lab_policy_watchdog --distpath dist/app --workpath build/app --specpath build/app lab_policy_watchdog.py

      - name: Build install.exe
        run: |
          $appExe = (Resolve-Path "dist/app/lab_policy_watchdog.exe").Path
          pyinstaller --noconfirm --onefile --name install --add-data "${appExe};." --distpath dist --workpath build/installer --specpath build/installer installer_bootstrap.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-windows-exe
          path: dist/install.exe
          if-no-files-found: error
